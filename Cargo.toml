[package]
name = "disquip-bot-rs"
version = "0.7.1"
edition = "2024"
description = "A Discord bot to play audio files (quips) on command"
readme = "README.md"
repository = "https://github.com/blthayer/disquip-bot-rs"
license = "MIT"
keywords = ["discord", "audio", "bot", "soundboard", "civ"]
categories = ["games", "multimedia::audio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
rand = "0.10"
serenity = {version = "0.12", features = ["client", "standard_framework", "voice"] }
poise = { version = "0.6" }
songbird = { version = "0.6", features = ["builtin-queue"] }
symphonia = { version = "0.6", features = ["mp3"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ahash = { version = "0.8" }

[profile.release]
lto = true
codegen-units = 1

[lints.clippy]
# correctness, suspicious, style, complexity, perf
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
